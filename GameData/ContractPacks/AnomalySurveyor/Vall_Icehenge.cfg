// Contract for visiting Icehenge.
//   Author: nightingale

CONTRACT_TYPE
{
    name = AS_Vall_Icehenge
    group = AnomalySurveyor

    sortKey = 04.01
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Joolean_moons
    genericDescription = #loc_AS_AS_Vall_Icehenge_genericDescription

    title = #loc_AS_AS_Vall_Icehenge_title
    description = #loc_AS_AS_Vall_Icehenge_description
    synopsis = #loc_AS_AS_Vall_Icehenge_synopsis
    completedMessage = #loc_AS_AS_Vall_Icehenge_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 3 prestige
    prestige = Exceptional

    targetBody = Vall

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 65000.0
    rewardReputation = 4.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Vall_Icehenge_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 50
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_AS_Vall_Icehenge_BEHAVIOUR1_WAYPOINT1_name
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            // The location name
            latitude = -60.0900852353683
            longitude = 83.7790303011986
            altitude = 0.0741341842804104
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Vall_Icehenge_BEHAVIOUR2_DIALOG_BOX1_title

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = #loc_AS_AS_Vall_Icehenge_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit

        title = #loc_AS_shared_Must_have_orbited_the_correct_Joolean_moon
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP0
        type = SCANsatLocationCoverage

        latitude = -60.0900852353683
        longitude = 83.7790303011986

        title = #loc_AS_AS_Vall_Icehenge_REQUIREMENT1_title_3
    }
}


@CONTRACT_TYPE[AS_Vall_Icehenge]:NEEDS[SCANsat]
{
    @description = Our scans picked up a rather unusual structure on Vall.  Go check it out.
}
