// Contract for the Mars Surveyor Lander anomaly.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Undiscovered_anomaly_on = #loc_AS_shared_Undiscovered_anomaly_on
		loc_AS_shared_Must_have_scanned_the_correct_location_on = #loc_AS_shared_Must_have_scanned_the_correct_location_on
		loc_AS_shared_with_the_anomaly_scanner = #loc_AS_shared_with_the_anomaly_scanner
	}

    name = AS_Duna_MSL
    group = AnomalySurveyor

    sortKey = 02.01
    genericTitle = @/loc_AS_shared_Undiscovered_anomaly_on + @targetBody
    genericDescription = #loc_AS_AS_Duna_MSL_genericDescription

    title = #loc_AS_AS_Duna_MSL_title
    description = #loc_AS_AS_Duna_MSL_description
    synopsis = #loc_AS_AS_Duna_MSL_synopsis
    completedMessage = #loc_AS_AS_Duna_MSL_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 2 prestige
    prestige = Significant

    targetBody = Duna

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    notes = #loc_AS_AS_Duna_MSL_notes

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 55000.0
    rewardReputation = 6.0

    DATA
    {
        type = double
        latitude = -30.3420000250979
        longitude = -28.8103764372908
        altitude = 1.64999494724907
    }

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Duna_MSL_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 10
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_AS_Duna_MSL_BEHAVIOUR1_WAYPOINT1_name
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            latitude = @/latitude
            longitude = @/longitude
            altitude = @/altitude
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Duna_MSL_BEHAVIOUR2_DIALOG_BOX1_title

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = #loc_AS_AS_Duna_MSL_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP0
        type = SCANsatLocationCoverage

        latitude = @/latitude
        longitude = @/longitude

        title = @/loc_AS_shared_Must_have_scanned_the_correct_location_on + @targetBody + @/loc_AS_shared_with_the_anomaly_scanner
    }
}


@CONTRACT_TYPE[AS_Duna_MSL]:NEEDS[SCANsat]
{
    @description = Our scans found what looks like a very small metal object on the surface of Duna, go check it out!
}
