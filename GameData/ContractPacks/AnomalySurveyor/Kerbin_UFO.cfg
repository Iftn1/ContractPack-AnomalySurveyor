// Contract for visiting the Kerbin UFO crash site.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Must_have_scanned_the_correct_location_on = #loc_AS_shared_Must_have_scanned_the_correct_location_on
		loc_AS_shared_with_the_anomaly_scanner = #loc_AS_shared_with_the_anomaly_scanner
	}

    name = AS_Kerbin_UFO
    group = AnomalySurveyor

    sortKey = 00.02
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Kerbin
    genericDescription = #loc_AS_AS_Kerbin_UFO_genericDescription

    title = #loc_AS_AS_Kerbin_UFO_title
    description = #loc_AS_AS_Kerbin_UFO_description
    synopsis = #loc_AS_shared_Investigate_a_crashed_vessel
    completedMessage = #loc_AS_AS_Kerbin_UFO_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 2 prestige
    prestige = Significant

    targetBody = Kerbin

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 75000.0
    rewardScience = 20.0
    rewardReputation = 8.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_shared_Investigate_the_crashed_vessel

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 15
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_shared_Crashed_vessel
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            // The location name
			latitude = 81.9551567431472
			longitude = 231.482239565662
			altitude = 5.34037477325178
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Kerbin_UFO_BEHAVIOUR2_DIALOG_BOX1_title

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Wernher
                animation = false_disagreeC
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_UFO_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP0
        type = SCANsatLocationCoverage

        latitude = 81.9551567431472
        longitude = 231.482239565662

        title = @/loc_AS_shared_Must_have_scanned_the_correct_location_on + @targetBody + @/loc_AS_shared_with_the_anomaly_scanner
    }
}

@CONTRACT_TYPE[AS_Kerbin_UFO]:NEEDS[SCANsat]
{
    @description = Our scans picked up what looks like a crashed vessel over the arctic ice.  It's not one of ours, but maybe we should check it out anyway?
}
