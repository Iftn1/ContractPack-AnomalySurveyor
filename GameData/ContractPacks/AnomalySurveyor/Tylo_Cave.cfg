// Contract for dead kraken anomaly.
//   Author: nightingale

CONTRACT_TYPE
{
    name = AS_Tylo_Cave
    group = AnomalySurveyor

    sortKey = 04.00
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Joolean_moons
    genericDescription = #loc_AS_AS_Tylo_Cave_genericDescription

    title = #loc_AS_AS_Tylo_Cave_title
    description = #loc_AS_AS_Tylo_Cave_description
    synopsis = #loc_AS_AS_Tylo_Cave_synopsis
    completedMessage = #loc_AS_AS_Tylo_Cave_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 3 prestige
    prestige = Exceptional

    targetBody = Tylo

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 70000.0
    rewardReputation = 3.4

    DATA
    {
        type = double
        latitude = 40.1759831291633
        longitude = -185.957917460248
        altitude = -1.01178375829477
    }

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Tylo_Cave_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 650
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_AS_Tylo_Cave_BEHAVIOUR1_WAYPOINT1_name
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            // The location
            latitude = @/latitude
            longitude = @/longitude
            altitude = @/altitude
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Tylo_Cave_BEHAVIOUR2_DIALOG_BOX1_title

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Strategy_Mortimer
                animation = idle_wonder
            }

            TEXT
            {
                text = #loc_AS_AS_Tylo_Cave_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }


    REQUIREMENT
    {
        name = Orbit
        type = Orbit

        title = #loc_AS_shared_Must_have_orbited_the_correct_Joolean_moon
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP1
        type = SCANsatLocationCoverage

        latitude = @/latitude
        longitude = @/longitude

        title = #loc_AS_AS_Tylo_Cave_REQUIREMENT1_title_3
    }
}
