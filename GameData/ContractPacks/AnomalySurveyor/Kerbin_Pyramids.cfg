// Contract for visiting the pyramids.
//   Author: nightingale

CONTRACT_TYPE
{
    name = AS_Kerbin_Pyramids
    group = AnomalySurveyor

    sortKey = 00.01
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Kerbin
    genericDescription = #loc_AS_AS_Kerbin_Pyramids_genericDescription

    title = #loc_AS_AS_Kerbin_Pyramids_title
    description = #loc_AS_AS_Kerbin_Pyramids_description
    synopsis = #loc_AS_AS_Kerbin_Pyramids_synopsis
    completedMessage = #loc_AS_AS_Kerbin_Pyramids_completedMessage

    // Level 1 prestige
    prestige = Trivial

    targetBody = Kerbin

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 50000.0
    rewardReputation = 35.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Kerbin_Pyramids_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 15
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_AS_Kerbin_Pyramids_BEHAVIOUR1_WAYPOINT1_name
            icon = ContractPacks/AnomalySurveyor/Icons/pyramids

            // The location
            latitude = -6.49976362801318
            longitude = -141.68024760056
            altitude = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_shared_Tut_Un_Jeb_Ahn

            condition = PARAMETER_COMPLETED
            parameter = WP0

            KERBAL
            {
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Pyramids_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text

            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_shared_Tut_Un_Jeb_Ahn

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = true_nodA
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Pyramids_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_shared_Tut_Un_Jeb_Ahn

            condition = PARAMETER_COMPLETED
            parameter = WP0

            KERBAL
            {
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Pyramids_BEHAVIOUR2_DIALOG_BOX3_TEXT1_text

            }
        }
    }

    REQUIREMENT
    {
        name = ReachSpace
        type = ReachSpace
    }
}
