// Contract for dead kraken anomaly.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Undiscovered_anomaly_on = #loc_AS_shared_Undiscovered_anomaly_on
		loc_AS_shared_Must_have_scanned_the_correct_location_on = #loc_AS_shared_Must_have_scanned_the_correct_location_on
		loc_AS_shared_with_the_anomaly_scanner = #loc_AS_shared_with_the_anomaly_scanner
	}

    name = AS_Moho_Mohole
    group = AnomalySurveyor

    sortKey = 03.00
    genericTitle = @/loc_AS_shared_Undiscovered_anomaly_on + @targetBody
    genericDescription = #loc_AS_AS_Moho_Mohole_genericDescription

    title = #loc_AS_AS_Moho_Mohole_title
    description = #loc_AS_AS_Moho_Mohole_description
    synopsis = #loc_AS_shared_Investigate_the_Mohole
    completedMessage = #loc_AS_AS_Moho_Mohole_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 2 prestige
    prestige = Significant

    targetBody = Moho

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 50000.0
    rewardScience = 6.4
    rewardReputation = 4.2

    DATA
    {
        type = double
        latitude = 90.0
        longitude = 0.0
        altitude = 5000
    }

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_shared_Investigate_the_Mohole

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 875
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_shared_Mohole
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            // The location
            latitude = @/latitude
            longitude = @/longitude
            altitude = @/altitude
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_shared_Mohole

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Wernher
                animation = idle_lookAround
            }

            TEXT
            {
                text = #loc_AS_AS_Moho_Mohole_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }


    REQUIREMENT
    {
        type = FlyBy
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP1
        type = SCANsatLocationCoverage

        latitude = @/latitude
        longitude = @/longitude

        title = @/loc_AS_shared_Must_have_scanned_the_correct_location_on + @targetBody + @/loc_AS_shared_with_the_anomaly_scanner
    }
}
