		//==================== Jool_Monolith.cfg ====================

		// EN: Undiscovered anomaly near Jool
		#loc_AS_AS_Jool_Monolith_genericTitle = Jool 附近未被发现的异常现象
		// EN: If we mess around with things that shouldn't be messed with, we may end up somewhere interesting.
		#loc_AS_AS_Jool_Monolith_genericDescription = 如果我们去碰那些不该碰的东西，最后可能就会落到某个有趣的地方。
		// EN: Investigate the monolith signal at Jool
		#loc_AS_AS_Jool_Monolith_title = 调查 Jool 的石像信号
		// EN: We've traced latest monolith signal to Jool.  We don't know exactly where in the Jool system, but w…
		#loc_AS_AS_Jool_Monolith_description = 我们已把最新的石像信号追踪到了 Jool。我们还不知道它在 Jool 星系中的确切位置，但我们相信，只要你能抵达那里，我们就能查清楚。
		// EN: Find out what's in the Jool system.
		#loc_AS_AS_Jool_Monolith_synopsis = 查明 Jool 星系里有什么。
