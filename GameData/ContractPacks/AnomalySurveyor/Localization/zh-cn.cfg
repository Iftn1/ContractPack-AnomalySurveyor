		// EN: Amazing...  you found an antique Kerbal civilization.  Can you see anything else?
		#loc_AS_AS_Kerbin_Pyramids_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text = 太惊人了…… 你发现了一个古老的 Kerbal 文明。 还能看到别的什么吗？
		// EN: There's an inscription on the statue:\n\n    My name is Tut-Un Jeb-Ahn, king of kings:\n    Look on…
		#loc_AS_AS_Kerbin_Pyramids_BEHAVIOUR2_DIALOG_BOX3_TEXT1_text = 雕像上刻着一段铭文：\n\n    吾名 Tut-Un Jeb-Ahn，众王之王：\n    看看我的功业吧，汝等强者，然后绝望吧！

		//==================== Kerbin_UFO.cfg ====================

		// EN: Once we've done a better job mapping out the planet we're likely to find another anomaly or two.
		#loc_AS_AS_Kerbin_UFO_genericDescription = 等我们把这颗星球测绘得更清楚一些，多半还能再找到一两处异常现象。
		// EN: Investigate an arctic crash site
		#loc_AS_AS_Kerbin_UFO_title = 调查一处极地坠毁地点
		// EN: There's are reports of a vessel going down over the arctic ice.  It's not one of ours, but maybe we…
