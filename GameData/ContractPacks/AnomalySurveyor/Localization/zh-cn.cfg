		// EN: Investigate TMA near the KSC
		#loc_AS_AS_Kerbin_Monolith_title = 调查 KSC 附近的 TMA
		// EN: Linus has been complaining that his Tycho brand gyroscopes have been behaving oddly for weeks.  Whe…
		#loc_AS_AS_Kerbin_Monolith_description = Linus 抱怨说他的 Tycho 牌陀螺仪已经古怪地闹了好几周。Wernher 终于去看了一眼，发现某种奇怪的磁场正在影响陀螺仪。它似乎来自 KSC 以北的某个地方。我们把它命名为 Tycho 磁异常（TMA）。去看看吧，看看那里有什么。
		// EN: Visit the Tycho Magnetic Anomaly.
		#loc_AS_AS_Kerbin_Monolith_synopsis = 访问 Tycho 磁异常。
		// EN: We're reading some sort of signals coming from the Monolith...  Wernher is analysing it.
		#loc_AS_AS_Kerbin_Monolith_completedMessage = 我们探测到石像那边传来某种信号…… Wernher 正在分析。
