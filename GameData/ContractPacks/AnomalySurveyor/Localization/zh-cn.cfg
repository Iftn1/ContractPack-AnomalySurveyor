		#loc_AS_AS_Kerbin_Monolith_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text = 想想看，就在我们后院，我们却从没看见过。也许行政楼里该开几扇窗户。

		//==================== Kerbin_Monolith_Additional.cfg ====================

		// EN: Where we find one anomaly, we're sure to find others!
		#loc_AS_AS_Kerbin_Monolith_Additional_genericDescription = 既然能找到一处异常现象，我们就一定能找到更多！
		// EN:  on Kerbin
		#loc_AS_AS_Kerbin_Monolith_Additional_title_s2 = （位于 Kerbin）
		// EN: After visiting the Tycho Magnetic Anomaly (now known as TMA-0), it started to send signals out in s…
		#loc_AS_AS_Kerbin_Monolith_Additional_description = 在访问了 Tycho 磁异常（现在被称为 TMA-0）之后，它开始向几个方向发出信号。我们能看出这些信号穿透了行星，并已计算出它们在地表所指向的位置。这些地点被标记为 TMA-1 到 TMA-4。我们需要弄清这些信号通向何处。
		// EN: The monolith seems to be sending out a signal out into space...  we need to triangulate as many mon…
		#loc_AS_AS_Kerbin_Monolith_Additional_completedMessage = 这座石像似乎正朝太空发出某种信号…… 我们需要尽可能多地三角定位石像信号。
		// EN: Visit TMA-1
		#loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER1_title = 访问 TMA-1
		// EN: Visit TMA-2
		#loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER2_title_2 = 访问 TMA-2
		// EN: Visit TMA-3
		#loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER3_title_3 = 访问 TMA-3
		// EN: Visit TMA-4
		#loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER4_title_4 = 访问 TMA-4
		// EN: TMA-1
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX1_title = TMA-1
		// EN: This monolith looks like it was recently dug up!
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text = 这座石像看上去像是最近才被挖出来的！
		// EN: TMA-2
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX2_title_2 = TMA-2
		// EN: Looks like an abandonded launch facility.  Were there other Kerbals that made it into space before …
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text = 看起来像是一座废弃的发射设施。 在我们之前还有别的 Kerbal 上过太空吗？
		// EN: TMA-3
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX3_title_3 = TMA-3
		// EN: It's really cold up here, even in the EVA suit.  Can I go home now?
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX3_TEXT1_text = 这上面真冷，就算穿着 EVA 宇航服也一样。 我现在能回家了吗？
		// EN: TMA-4
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX4_title_4 = TMA-4
		// EN: This looks like a great place to hide a super secret base!
		#loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX4_TEXT1_text = 这地方看起来很适合藏一座超级秘密基地！
		// EN: Must have discovered a similar anomaly
		#loc_AS_AS_Kerbin_Monolith_Additional_REQUIREMENT1_title_5 = 必须已发现过一处相似的异常现象

		//==================== Kerbin_Pyramids.cfg ====================

		// EN: Keep launching more rockets, and we'll see if we can find another anomaly for you to check out.
		#loc_AS_AS_Kerbin_Pyramids_genericDescription = 继续多发射几枚火箭，我们看看能不能再给你找一处异常现象去勘查。
		// EN: Investigate structures in Kerbin's desert
		#loc_AS_AS_Kerbin_Pyramids_title = 调查 Kerbin 沙漠中的建筑
		// EN: From orbit, we can see something strange in the western desert.  There's what look like pyramids in…
		#loc_AS_AS_Kerbin_Pyramids_description = 从轨道上，我们能看到西部沙漠里有某种奇怪的东西。 那片沙漠无法从地面进入，其中似乎有金字塔。 如果我们能降落下去仔细查看，Kerbin 考古学会一定会感激不尽。
		// EN: Visit the structures in the desert.
		#loc_AS_AS_Kerbin_Pyramids_synopsis = 前往沙漠中的建筑。
		// EN: What will future archeologist think when they see the KSC?
		#loc_AS_AS_Kerbin_Pyramids_completedMessage = 未来的考古学家看到 KSC 时会怎么想？
		// EN: Check out the pyramids
