		#loc_AS_AS_Jool_Monolith_completedMessage = 嗯，那确实挺有意思的……
		// EN: Investigate the situation
		#loc_AS_AS_Jool_Monolith_PARAMETER1_title = 调查现场情况
		// EN: Approach within 20km of the unknown object
		#loc_AS_AS_Jool_Monolith_PARAMETER1_PARAMETER2_title = 接近不明物体至 20km 以内
		// EN: The Star Jeb is Born
		#loc_AS_AS_Jool_Monolith_BEHAVIOUR1_DIALOG_BOX1_title = 星之 Jeb 诞生
		// EN: And so it was that $starJebName became an immortal being known as "The Star Jeb".  After the Star J…
		#loc_AS_AS_Jool_Monolith_BEHAVIOUR1_DIALOG_BOX1_TEXT1_text = 于是 $starJebName 就这样成了一位不朽的存在，人们称之为「星之 Jeb」。在星之 Jeb 超脱之后，Jool 的石像消失了——没人知道它是否还会再次出现。\n\n至于星之 Jeb，他们有能力把 Kerbal 的科学和 Kerbal 太空计划推向崭新的高度，可他们却什么都没做。\n\n事实上，有传言说他们甚至没给自己的妈妈打过电话。
		// EN: $starJebName.FirstWord() is coming back...\n\nRight?
		#loc_AS_AS_Jool_Monolith_BEHAVIOUR1_DIALOG_BOX2_TEXT1_text = $starJebName.FirstWord() 要回来了……\n\n对吧？
