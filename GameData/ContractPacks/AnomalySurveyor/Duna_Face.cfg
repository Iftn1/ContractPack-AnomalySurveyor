// Contract for the face on Duna anomaly.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Undiscovered_anomaly_on = #loc_AS_shared_Undiscovered_anomaly_on
		loc_AS_shared_Must_have_scanned_the_correct_location_on = #loc_AS_shared_Must_have_scanned_the_correct_location_on
		loc_AS_shared_with_the_anomaly_scanner = #loc_AS_shared_with_the_anomaly_scanner
	}

    name = AS_Duna_Face
    group = AnomalySurveyor

    sortKey = 02.00
    genericTitle = @/loc_AS_shared_Undiscovered_anomaly_on + @targetBody
    genericDescription = #loc_AS_AS_Duna_Face_genericDescription

    title = #loc_AS_AS_Duna_Face_title
    description = #loc_AS_AS_Duna_Face_description
    synopsis = #loc_AS_AS_Duna_Face_synopsis
    completedMessage = #loc_AS_AS_Duna_Face_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 2 prestige
    prestige = Significant

    targetBody = Duna

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 50000.0
    rewardReputation = 8.0

    DATA
    {
        type = double
        latitude = 17.0595312879941
        longitude = 274.540904325699
        altitude = 20.76864546351
    }

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Duna_Face_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 50
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_shared_Cydunia
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            latitude = @/latitude
            longitude = @/longitude
            altitude = @/altitude
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_shared_Cydunia

            condition = PARAMETER_COMPLETED
            parameter = WP0

            KERBAL
            {
            }

            TEXT
            {
                text = #loc_AS_AS_Duna_Face_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_shared_Cydunia

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Strategy_ScienceGuy
                animation = false_disagreeC
            }

            TEXT
            {
                text = #loc_AS_AS_Duna_Face_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Any
        type = Any

        REQUIREMENT
        {
            name = Orbit
            type = Orbit
        }
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP0
        type = SCANsatLocationCoverage

        latitude = @/latitude
        longitude = @/longitude

        title = @/loc_AS_shared_Must_have_scanned_the_correct_location_on + @targetBody + @/loc_AS_shared_with_the_anomaly_scanner
    }
}
