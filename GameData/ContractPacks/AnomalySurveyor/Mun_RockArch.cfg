// Contract for visiting the Mun rock arches.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Undiscovered_anomaly_on = #loc_AS_shared_Undiscovered_anomaly_on
		loc_AS_AS_Mun_RockArch_REQUIREMENT1_title_4_s1 = #loc_AS_AS_Mun_RockArch_REQUIREMENT1_title_4_s1
		loc_AS_shared_with_the_anomaly_scanner = #loc_AS_shared_with_the_anomaly_scanner
	}

    name = AS_Mun_RockArch
    group = AnomalySurveyor

    sortKey = 01.01
    genericTitle = @/loc_AS_shared_Undiscovered_anomaly_on + @targetBody
    genericDescription = #loc_AS_shared_What_kind_of_anomalies_might_we_find_if_we_visit

    title = #loc_AS_AS_Mun_RockArch_title
    description = #loc_AS_AS_Mun_RockArch_description
    synopsis = #loc_AS_AS_Mun_RockArch_synopsis
    completedMessage = #loc_AS_AS_Mun_RockArch_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 2 prestige
    prestige = Significant

    targetBody = Mun

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 300000.0
    rewardReputation = 5.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Mun_RockArch_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 125
        }
    }

    PARAMETER
    {
        name = WP1
        type = All
        title = #loc_AS_AS_Mun_RockArch_PARAMETER2_title_2

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 1
            distance = 125
        }
    }

    PARAMETER
    {
        name = WP2
        type = All
        title = #loc_AS_AS_Mun_RockArch_PARAMETER3_title_3

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 2
            distance = 125
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        PQS_CITY
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_PQS_CITY_Rock_Arch_1_name
            icon = ContractPacks/AnomalySurveyor/Icons/arch

            // The location name
            pqsCity = RockArch00
        }

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_AS_Mun_RockArch_BEHAVIOUR1_WAYPOINT1_name_2
            icon = ContractPacks/AnomalySurveyor/Icons/arch

            latitude = -12.4651384728768
            longitude = -140.954333098427
            altitude = 0.0
        }

        PQS_CITY
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_PQS_CITY_Rock_Arch_3_name_3
            icon = ContractPacks/AnomalySurveyor/Icons/arch

            // The location name
            pqsCity = RockArch02
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_RockArch_BEHAVIOUR2_DIALOG_BOX1_title

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = idle_wonder
            }

            TEXT
            {
                text = #loc_AS_AS_Mun_RockArch_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_RockArch_BEHAVIOUR2_DIALOG_BOX2_title_2

            condition = PARAMETER_COMPLETED
            parameter = WP1

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = true_thumbUp
            }

            TEXT
            {
                text = #loc_AS_AS_Mun_RockArch_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_RockArch_BEHAVIOUR2_DIALOG_BOX3_title_3

            condition = PARAMETER_COMPLETED
            parameter = WP2

            INSTRUCTOR
            {
                name = Strategy_PRGuy 
                animation = true_nodA
            }

            TEXT
            {
                text = #loc_AS_AS_Mun_RockArch_BEHAVIOUR2_DIALOG_BOX3_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        type = All

        hideChildren = true
        title = @/loc_AS_AS_Mun_RockArch_REQUIREMENT1_title_4_s1 + @targetBody + @/loc_AS_shared_with_the_anomaly_scanner

        REQUIREMENT
        {
            name = WP1
            type = SCANsatLocationCoverage

            pqsCity = RockArch00
        }

        REQUIREMENT
        {
            name = WP1
            type = SCANsatLocationCoverage

            latitude = -12.4651384728768
            longitude = -140.954333098427
        }

        REQUIREMENT
        {
            name = WP2
            type = SCANsatLocationCoverage

            pqsCity = RockArch02
        }
    }
}


@CONTRACT_TYPE[AS_Mun_RockArch]:NEEDS[SCANsat]
{
    @description = Our scans found some cool looking arches!  Surely they're good for something, let's go see!
}
