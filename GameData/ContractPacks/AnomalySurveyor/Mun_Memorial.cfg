// Contract for visiting the Mun memorial.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Undiscovered_anomaly_on = #loc_AS_shared_Undiscovered_anomaly_on
		loc_AS_shared_Must_have_scanned_the_correct_location_on = #loc_AS_shared_Must_have_scanned_the_correct_location_on
		loc_AS_shared_with_the_anomaly_scanner = #loc_AS_shared_with_the_anomaly_scanner
	}

    name = AS_Mun_Memorial
    group = AnomalySurveyor

    sortKey = 01.00
    genericTitle = @/loc_AS_shared_Undiscovered_anomaly_on + @targetBody
    genericDescription = #loc_AS_shared_What_kind_of_anomalies_might_we_find_if_we_visit

    title = #loc_AS_AS_Mun_Memorial_title
    description = #loc_AS_AS_Mun_Memorial_description
    synopsis = #loc_AS_AS_Mun_Memorial_synopsis
    completedMessage = #loc_AS_AS_Mun_Memorial_completedMessage

    // Indicates a contract where SCANsat multipliers should be applied
    tag = SCANsat

    // Level 1 prestige
    prestige = Trivial

    targetBody = Mun

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    notes = #loc_AS_AS_Mun_Memorial_notes

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 100000.0
    rewardReputation = 5.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Mun_Memorial_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 35
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_shared_Memorial
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            latitude = 0.702755930739038
            longitude = -337.253233355146
            altitude = 14.2626853691763
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_shared_Memorial

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Gene
            }

            TEXT
            {
                text = #loc_AS_AS_Mun_Memorial_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit
    }

    REQUIREMENT:NEEDS[SCANsat]
    {
        name = WP1
        type = SCANsatLocationCoverage

        latitude = 0.702755930739038
        longitude = -337.253233355146

        title = @/loc_AS_shared_Must_have_scanned_the_correct_location_on + @targetBody + @/loc_AS_shared_with_the_anomaly_scanner
    }
}
