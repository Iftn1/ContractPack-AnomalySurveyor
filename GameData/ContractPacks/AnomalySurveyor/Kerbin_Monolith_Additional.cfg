// Contract for the Kerbin monoliths.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Investigate = #loc_AS_shared_Investigate
		loc_AS_AS_Kerbin_Monolith_Additional_title_s2 = #loc_AS_AS_Kerbin_Monolith_Additional_title_s2
	}

    name = AS_Kerbin_Monolith_Additional
    group = AnomalySurveyor

    sortKey = 00.04.@anomalyIndex
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Kerbin
    genericDescription = #loc_AS_AS_Kerbin_Monolith_Additional_genericDescription

    title = @/loc_AS_shared_Investigate + @anomalyName + @/loc_AS_AS_Kerbin_Monolith_Additional_title_s2
    description = #loc_AS_AS_Kerbin_Monolith_Additional_description
    synopsis = @/loc_AS_shared_Investigate + @anomalyName.
    completedMessage = #loc_AS_AS_Kerbin_Monolith_Additional_completedMessage

    // Level 2 prestige
    prestige = Trivial

    targetBody = Kerbin

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can do the contract once per anomaly
    maxCompletions = 1

    // Contract rewards
    rewardFunds = @rewards.ElementAt(@anomalyIndex)
    rewardScience = 40.0
    rewardReputation = 20.0

    DATA
    {
        type = List<string>
        anomalyNames = [ "TMA-1", "TMA-2", "TMA-3", "TMA-4" ]
    }

    DATA
    {
        type = List<double>

        latitudes = [ -0.640167416590071, 20.6708959294282, -28.8083154046288, 35.5705099080007 ]
        longitudes = [ 279.233233547805, 213.503158424511, -13.4401155804507, -74.9770427670473 ]
        rewards = [ 40000, 60000, 80000, 100000 ]
    }

    DATA_EXPAND
    {
        type = int

        anomalyIndex = [0, 1, 2, 3]
    }

    DATA
    {
        type = string
        anomalyName = @anomalyNames.ElementAt(@anomalyIndex)
    }

    DATA
    {
        type = double
        latitude = @latitudes.ElementAt(@anomalyIndex)
        longitude = @longitudes.ElementAt(@anomalyIndex)
    }

    PARAMETER
    {
        name = WP1
        type = All
        title = #loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 50
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 0
        }
    }

    PARAMETER
    {
        name = WP2
        type = All
        title = #loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER2_title_2

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 15
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 1
        }
    }

    PARAMETER
    {
        name = WP3
        type = All
        title = #loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER3_title_3

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 35
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 2
        }
    }

    PARAMETER
    {
        name = WP4
        type = All
        title = #loc_AS_AS_Kerbin_Monolith_Additional_PARAMETER4_title_4

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 35
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 3
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = @/anomalyName
            icon = ContractPacks/AnomalySurveyor/Icons/monolith

            // The location
            latitude = @/latitude
            longitude = @/longitude
            altitude = 0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX1_title

            condition = PARAMETER_COMPLETED
            parameter = WP1

            KERBAL
            {
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX2_title_2

            condition = PARAMETER_COMPLETED
            parameter = WP2

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = idle_lookAround
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX3_title_3

            condition = PARAMETER_COMPLETED
            parameter = WP3

            KERBAL
            {
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX3_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX4_title_4

            condition = PARAMETER_COMPLETED
            parameter = WP4

            KERBAL
            {
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Monolith_Additional_BEHAVIOUR2_DIALOG_BOX4_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        type = CompleteContract

        contractType = AS_Kerbin_Monolith

        title = #loc_AS_AS_Kerbin_Monolith_Additional_REQUIREMENT1_title_5
    }
}
