// Contract for the Kerbin monoliths.
//   Author: nightingale

CONTRACT_TYPE
{
    name = AS_Kerbin_Monolith
    group = AnomalySurveyor

    sortKey = 00.03
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Kerbin
    genericDescription = #loc_AS_AS_Kerbin_Monolith_genericDescription

    title = #loc_AS_AS_Kerbin_Monolith_title
    description = #loc_AS_AS_Kerbin_Monolith_description
    synopsis = #loc_AS_AS_Kerbin_Monolith_synopsis
    completedMessage = #loc_AS_AS_Kerbin_Monolith_completedMessage

    // Level 2 prestige
    prestige = Significant

    targetBody = Kerbin

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 30000.0
    rewardScience = 20.0
    rewardReputation = 15.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Kerbin_Monolith_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 15
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_shared_TMA
            icon = ContractPacks/AnomalySurveyor/Icons/monolith

            // The location
            latitude = 0.10227297919058
            longitude = -74.5684338987643
            altitude = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_shared_TMA

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = idle_wonder
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_Monolith_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        type = Any

        REQUIREMENT
        {
            type = FlyBy

            targetBody = Mun
        }

        REQUIREMENT
        {
            type = FlyBy

            targetBody = Minmus
        }
    }
}
