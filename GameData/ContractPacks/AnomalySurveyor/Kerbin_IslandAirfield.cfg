// Contract for visiting the island airfield.
//   Author: nightingale

CONTRACT_TYPE
{
    name = AS_Kerbin_IslandAirfield
    group = AnomalySurveyor

    sortKey = 00.00
    genericTitle = #loc_AS_shared_Undiscovered_anomaly_on_Kerbin
    genericDescription = #loc_AS_AS_Kerbin_IslandAirfield_genericDescription

    title = #loc_AS_AS_Kerbin_IslandAirfield_title
    description = #loc_AS_AS_Kerbin_IslandAirfield_description
    synopsis = #loc_AS_AS_Kerbin_IslandAirfield_synopsis
    completedMessage = #loc_AS_AS_Kerbin_IslandAirfield_completedMessage

    // Level 1 prestige
    prestige = Trivial

    targetBody = Kerbin

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 25000.0
    rewardReputation = 2.0

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Kerbin_IslandAirfield_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 5
        }
    }

    PARAMETER
    {
        name = WP1
        type = All
        title = #loc_AS_AS_Kerbin_IslandAirfield_PARAMETER2_title_2

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 1
            distance = 25
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        PQS_CITY
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_shared_Control_Tower
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            // The location
            pqsCity = IslandAirfield
            pqsOffset = -25.5440407030383, -180.724966497429, 59.493380329812
            altitude = 59.493380329812
        }

        PQS_CITY
        {
            // The name of the waypoint - displayed on the marker
            name = #loc_AS_PQS_CITY_Pod_in_Hangar_name_2
            icon = ContractPacks/AnomalySurveyor/Icons/unknown

            // The location
            pqsCity = IslandAirfield
            pqsOffset = -102.891933658238, -107.91985303655, 18.1263730936462
            altitude = 18.1263730936462
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_shared_Control_Tower

            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = true_smileA
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_IslandAirfield_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Kerbin_IslandAirfield_BEHAVIOUR2_DIALOG_BOX2_title_2

            condition = PARAMETER_COMPLETED
            parameter = WP1

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = false_sadA
            }

            TEXT
            {
                text = #loc_AS_AS_Kerbin_IslandAirfield_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = FirstLaunch
        type = FirstLaunch
    }
}
