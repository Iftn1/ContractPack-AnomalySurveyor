// Contract for visiting the Mun monoliths.
//   Author: nightingale

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_AS_shared_Undiscovered_anomaly_on = #loc_AS_shared_Undiscovered_anomaly_on
		loc_AS_AS_Mun_Monolith_genericDescription_s1 = #loc_AS_AS_Mun_Monolith_genericDescription_s1
		loc_AS_AS_Mun_Monolith_genericDescription_s2 = #loc_AS_AS_Mun_Monolith_genericDescription_s2
		loc_AS_shared_Investigate = #loc_AS_shared_Investigate
		loc_AS_AS_Mun_Monolith_title_s2 = #loc_AS_AS_Mun_Monolith_title_s2
	}

    name = AS_Mun_Monolith
    group = AnomalySurveyor

    sortKey = 01.03.@anomalyIndex
    genericTitle = @/loc_AS_shared_Undiscovered_anomaly_on + @targetBody
    genericDescription = @/loc_AS_AS_Mun_Monolith_genericDescription_s1 + @targetBody + @/loc_AS_AS_Mun_Monolith_genericDescription_s2

    title = @/loc_AS_shared_Investigate + @anomalyName + @/loc_AS_AS_Mun_Monolith_title_s2 + @targetBody
    description = #loc_AS_AS_Mun_Monolith_description
    synopsis = @/loc_AS_shared_Investigate + @anomalyName.
    completedMessage = #loc_AS_AS_Mun_Monolith_completedMessage

    // Level 2 prestige
    prestige = Significant

    targetBody = @anomalyIndex == 3 ? Minmus : Mun

    // Always offered by the Anomaly Surveyor Group
    agent = Anomaly Surveyor Group

    // Can do the contract once per anomaly
    maxCompletions = 1

    // Contract rewards
    rewardFunds = @rewards.ElementAt(@anomalyIndex)
    rewardScience = 10.0
    rewardReputation = 10.0

    DATA
    {
        type = List<string>
        anomalyNames = [ "TMA-5", "TMA-6", "TMA-7", "TMA-8" ]
    }

    DATA
    {
        type = List<double>

        latitudes = [ -9.83137229999611, 57.660236164984, -82.206266198768, 23.7759194904872 ]
        longitudes = [ -334.082286806068, -350.85775273975, 102.928400491749, 60.0463591764103 ]
        altitudes = [ 9.27708882157458, 0.20538711422705, -181.768236982782, 0.332117420577561 ]
        rewards = [ 50000, 75000, 125000, 25000 ]
    }

    DATA_EXPAND
    {
        type = int

        anomalyIndex = [0, 1, 2, 3]
    }

    DATA
    {
        type = string
        anomalyName = @anomalyNames.ElementAt(@anomalyIndex)
    }

    DATA
    {
        type = double
        latitude = @latitudes.ElementAt(@anomalyIndex)
        longitude = @longitudes.ElementAt(@anomalyIndex)
        altitude = @altitudes.ElementAt(@anomalyIndex)
    }

    PARAMETER
    {
        name = WP0
        type = All
        title = #loc_AS_AS_Mun_Monolith_PARAMETER1_title

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 25
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 0
        }
    }

    PARAMETER
    {
        name = WP1
        type = All
        title = #loc_AS_AS_Mun_Monolith_PARAMETER2_title_2

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 25
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 1
        }
    }

    PARAMETER
    {
        name = WP2
        type = All
        title = #loc_AS_AS_Mun_Monolith_PARAMETER3_title_3

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 25
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 2
        }
    }

    PARAMETER
    {
        name = WP3
        type = All
        title = #loc_AS_AS_Mun_Monolith_PARAMETER4_title_4

        PARAMETER
        {
            name = VesselIsType
            type = VesselIsType

            vesselType = EVA
        }

        PARAMETER
        {
            name = VisitWaypoint
            type = VisitWaypoint

            index = 0
            distance = 25
        }

        REQUIREMENT
        {
            type = Expression
            
            expression = @/anomalyIndex == 3
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            // The name of the waypoint - displayed on the marker
            name = @/anomalyName
            icon = ContractPacks/AnomalySurveyor/Icons/monolith

            // The location
            latitude = @/latitude
            longitude = @/longitude
            altitude = @/altitude
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX1_title
            condition = PARAMETER_COMPLETED
            parameter = WP0

            INSTRUCTOR
            {
                name = Strategy_Mortimer
                animation = false_disappointed
            }
            TEXT
            {
                text = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX1_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX2_title_2
            condition = PARAMETER_COMPLETED
            parameter = WP1

            KERBAL
            {
            }
            TEXT
            {
                text = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX2_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX3_title_3
            condition = PARAMETER_COMPLETED
            parameter = WP2

            INSTRUCTOR
            {
                name = Instructor_Gene
                animation = true_thumbUp
            }
            TEXT
            {
                text = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX3_TEXT1_text
            }
        }

        DIALOG_BOX
        {
            title = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX4_title_4
            condition = PARAMETER_COMPLETED
            parameter = WP3

            KERBAL
            {
            }
            TEXT
            {
                text = #loc_AS_AS_Mun_Monolith_BEHAVIOUR2_DIALOG_BOX4_TEXT1_text
            }
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit
    }

    REQUIREMENT
    {
        type = AtLeast

        count = 2

        REQUIREMENT
        {
            type = CompleteContract
            contractType = AS_Kerbin_Monolith_Additional.0

            title = #loc_AS_shared_Must_have_visited_a_similar_anomaly_on_Kerbin
        }

        REQUIREMENT
        {
            type = CompleteContract
            contractType = AS_Kerbin_Monolith_Additional.1

            title = #loc_AS_shared_Must_have_visited_a_similar_anomaly_on_Kerbin
        }

        REQUIREMENT
        {
            type = CompleteContract
            contractType = AS_Kerbin_Monolith_Additional.2

            title = #loc_AS_shared_Must_have_visited_a_similar_anomaly_on_Kerbin
        }

        REQUIREMENT
        {
            type = CompleteContract
            contractType = AS_Kerbin_Monolith_Additional.3

            title = #loc_AS_shared_Must_have_visited_a_similar_anomaly_on_Kerbin
        }
    }
}
